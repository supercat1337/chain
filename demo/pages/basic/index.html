<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Basic – Chain Demo</title>
        <link rel="stylesheet" href="../../styles/demo.css" />
        <style>
            #output {
                background: #f1f5f9;
                padding: 0.75rem;
                border-radius: 0.5rem;
                font-family: monospace;
                min-height: 3rem;
            }
            .log {
                background: #0f172a;
                color: #e2e8f0;
                padding: 0.75rem;
                border-radius: 0.5rem;
                font-family: monospace;
                font-size: 0.875rem;
                max-height: 200px;
                overflow-y: auto;
                white-space: pre-wrap;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h2>Basic Chain</h2>
            <p>
                Simple chain of three tasks that pass values along. Each task sleeps for 1 second.
            </p>

            <section>
                <button id="run-btn">Run Chain</button>
                <button id="reset-btn" class="secondary">Reset</button>
            </section>

            <section>
                <h3>Result</h3>
                <div id="output">—</div>
            </section>

            <section>
                <h3>Log</h3>
                <div id="log" class="log">Ready</div>
            </section>

            <p><a href="../../index.html">← Back</a></p>
        </div>

        <script type="importmap">
            {
                "imports": {
                    "@supercat1337/chain": "../../../dist/chain.esm.bundle.js"
                }
            }
        </script>
        <script type="module" src="main.js"></script>
    </body>
</html>
