<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fetch + Cache – Chain Demo</title>
        <link rel="stylesheet" href="../../styles/demo.css" />
        <style>
            #output {
                background: #f1f5f9;
                padding: 0.75rem;
                border-radius: 0.5rem;
                font-family: monospace;
                min-height: 3rem;
                max-height: 300px;
                overflow: auto;
                white-space: pre-wrap;
            }
            .log {
                background: #0f172a;
                color: #e2e8f0;
                padding: 0.75rem;
                border-radius: 0.5rem;
                font-family: monospace;
                font-size: 0.875rem;
                max-height: 200px;
                overflow-y: auto;
                white-space: pre-wrap;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h2>Fetch + Cache</h2>
            <p>Enter a post ID (1–100) to fetch and cache the result.</p>

            <section>
                <div>
                    <label
                        >Post ID: <input type="number" id="input" min="1" max="100" value="1"
                    /></label>
                    <button id="fetch-btn">Fetch</button>
                    <button id="cancel-btn" class="danger">Cancel</button>
                    <button id="reset-btn" class="secondary">Reset</button>
                </div>
                <div><strong>Status:</strong> <span id="status">Idle</span></div>
                <div><strong>Cache hits:</strong> <span id="cache-hits">0</span></div>
            </section>

            <section>
                <h3>Response</h3>
                <div id="output">—</div>
            </section>

            <section>
                <h3>Log</h3>
                <div id="log" class="log">Ready</div>
            </section>

            <p><a href="../../index.html">← Back</a></p>
        </div>

        <script type="importmap">
            {
                "imports": {
                    "@supercat1337/chain": "../../../dist/chain.esm.bundle.js"
                }
            }
        </script>
        <script type="module" src="main.js"></script>
    </body>
</html>
